<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Học Tập - Tiếng Anh 8</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; }
        nav { background: #1a73e8; color: white; padding: 15px 5%; display: flex; justify-content: space-between; }
        .container { max-width: 800px; margin: 30px auto; padding: 20px; }
        .unit-card { background: white; padding: 20px; margin-bottom: 10px; border-radius: 10px; cursor: pointer; transition: 0.3s; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
        .unit-card:hover { transform: translateX(10px); background: #e8f0fe; }
        .quiz-container { background: white; padding: 30px; border-radius: 15px; display: none; }
        .question { margin-bottom: 20px; font-weight: bold; color: #2c3e50; }
        .option { display: block; padding: 10px; margin: 5px 0; border: 1px solid #ddd; border-radius: 5px; cursor: pointer; }
        .option:hover { background: #f8f9fa; }
        .btn-back { background: #6c757d; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-bottom: 20px; }
        .score { font-size: 20px; color: #1a73e8; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

<nav>
    <span>ENGLISH 8 - KHÓA HỌC</span>
    <span id="user-name">Đang tải...</span>
</nav>

<div class="container">
    <div id="unit-list">
        <h2>Chọn Unit để bắt đầu học:</h2>
        <div id="units"></div>
    </div>

    <div id="quiz-area" class="quiz-container">
        <button class="btn-back" onclick="showUnits()">← Quay lại danh sách</button>
        <h2 id="quiz-title"></h2>
        <div id="questions-content"></div>
        <button id="submit-btn" style="background:#34a853; color:white; width:100%; padding:15px; border:none; border-radius:10px; font-size:18px; cursor:pointer; margin-top:20px;">NỘP BÀI</button>
        <div id="result" class="score" style="margin-top:20px;"></div>
    </div>
</div>

<script>
    // Dữ liệu mẫu 12 Unit (Bạn có thể thêm câu hỏi vào đây)
    const data = {
        1: { title: "Unit 1: Leisure Time", questions: [
            { q: "What do you like doing in your free time?", a: ["I like swimming", "I am a student", "It is hot", "No, I don't"], correct: 0 },
            { q: "She is fond ____ reading books.", a: ["on", "at", "of", "with"], correct: 2 }
        ]},
        2: { title: "Unit 2: Life in the Countryside", questions: [
            { q: "The sky is ____ than in the city.", a: ["blue", "bluer", "more blue", "bluest"], correct: 1 }
        ]},
        // ... Thêm tiếp cho đến Unit 12
    };

    // Tạo danh sách Unit tự động
    function loadUnits() {
        const container = document.getElementById('units');
        for (let i = 1; i <= 12; i++) {
            container.innerHTML += `
                <div class="unit-card" onclick="startQuiz(${i})">
                    <span>Unit ${i}: ${data[i]?.title || "Nội dung đang cập nhật"}</span>
                    <span style="color:#1a73e8; font-weight:bold;">▶</span>
                </div>
            `;
        }
    }

    function startQuiz(unitId) {
        const unit = data[unitId];
        if (!unit) return alert("Bài học này đang được chuẩn bị!");
        
        document.getElementById('unit-list').style.display = 'none';
        document.getElementById('quiz-area').style.display = 'block';
        document.getElementById('quiz-title').innerText = unit.title;
        
        const content = document.getElementById('questions-content');
        content.innerHTML = unit.questions.map((q, i) => `
            <div class="question">${i+1}. ${q.q}</div>
            ${q.a.map((opt, j) => `
                <label class="option">
                    <input type="radio" name="q${i}" value="${j}"> ${opt}
                </label>
            `).join('')}
        `).join('');

        document.getElementById('submit-btn').onclick = () => checkResult(unitId);
    }

    function checkResult(unitId) {
        const unit = data[unitId];
        let score = 0;
        unit.questions.forEach((q, i) => {
            const selected = document.querySelector(`input[name="q${i}"]:checked`);
            if (selected && parseInt(selected.value) === q.correct) score++;
        });
        document.getElementById('result').innerText = `Bạn đúng: ${score}/${unit.questions.length} câu!`;
    }

    function showUnits() {
        document.getElementById('unit-list').style.display = 'block';
        document.getElementById('quiz-area').style.display = 'none';
        document.getElementById('result').innerText = '';
    }

    // Lấy tên người dùng từ Server
    fetch('/api/user-status').then(res => res.json()).then(user => {
        document.getElementById('user-name').innerText = user.loggedIn ? "Học sinh: " + user.username : "Chưa đăng nhập";
    });

    loadUnits();
</script>
</body>
</html>
