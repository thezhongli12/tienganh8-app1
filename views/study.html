<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học Tập - English 8</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1a73e8;
            --success: #34a853;
            --bg: #f0f4f8;
            --text: #2c3e50;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg); 
            color: var(--text);
            margin: 0; 
            padding: 20px; 
        }

        .container { 
            max-width: 700px; 
            margin: 20px auto; 
        }

        .quiz-header {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
        }

        .btn-back {
            background: white;
            border: 1px solid #ddd;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
            margin-right: 20px;
        }

        .btn-back:hover { background: #eee; }

        h2#quiz-title { margin: 0; color: var(--primary); font-size: 24px; }

        .question-card { 
            background: white; 
            padding: 25px; 
            border-radius: 16px; 
            margin-bottom: 20px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.05);
        }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            display: block;
        }

        .options-group { display: flex; flex-direction: column; gap: 12px; }

        .option-label {
            display: flex;
            align-items: center;
            padding: 14px 20px;
            border: 2px solid #edf2f7;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .option-label:hover {
            border-color: var(--primary);
            background-color: #f0f7ff;
        }

        .option-label input[type="radio"] {
            margin-right: 15px;
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
        }

        .btn-submit { 
            width: 100%; 
            padding: 18px; 
            background: var(--success); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-size: 18px; 
            font-weight: 700; 
            cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(52, 168, 83, 0.3);
            transition: transform 0.2s, background 0.2s;
        }

        .btn-submit:hover { 
            background: #2d8e47; 
            transform: translateY(-2px);
        }

        #result-box {
            margin-top: 30px;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            display: none;
        }

        .score-text { font-size: 24px; font-weight: 800; color: var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <div id="quiz-area">
        <div class="quiz-header">
            <button class="btn-back" onclick="window.location.href='/'">← Thoát</button>
            <h2 id="quiz-title">Đang tải...</h2>
        </div>

        <div id="questions-list"></div>

        <button id="submit-btn" class="btn-submit">KIỂM TRA KẾT QUẢ</button>
        
        <div id="result-box">
            <p class="score-text" id="final-score"></p>
            <button class="btn-back" onclick="window.location.href='/'" style="margin-top:15px;">Về trang chủ</button>
        </div>
    </div>
</div>

<script>
    // DỮ LIỆU ĐƯỢC ĐỔ THẲNG TỪ SERVER XUỐNG
    const unit = <%- JSON.stringify(unit) %>;
    const unitId = "<%= id %>";

    function loadQuiz() {
        if (unit && unit.questions) {
            document.getElementById('quiz-title').innerText = unit.title;

            const qList = document.getElementById('questions-list');
            qList.innerHTML = unit.questions.map((q, i) => `
                <div class="question-card">
                    <span class="question-text">Câu ${i+1}: ${q.question}</span>
                    <div class="options-group">
                        ${q.options.map((opt, j) => `
                            <label class="option-label">
                                <input type="radio" name="q${i}" value="${j}">
                                <span>${opt}</span>
                            </label>
                        `).join('')}
                    </div>
                </div>
            `).join('');

            document.getElementById('submit-btn').onclick = () => {
                let score = 0;
                unit.questions.forEach((q, i) => {
                    const sel = document.querySelector(`input[name="q${i}"]:checked`);
                    if (sel && parseInt(sel.value) === q.correct) score++;
                });

                document.getElementById('submit-btn').style.display = 'none';
                const resBox = document.getElementById('result-box');
                resBox.style.display = 'block';
                resBox.style.backgroundColor = '#e6fffa';
                document.getElementById('final-score').innerText = `🎉 Bạn đúng ${score}/${unit.questions.length} câu!`;
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            };
        } else {
            document.getElementById('quiz-title').innerText = "Không tìm thấy bài học!";
        }
    }

    // Chạy khi trang sẵn sàng
    window.onload = loadQuiz;
</script>

</body>
</html>
