<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Luyện Tập - Tiếng Anh 8</title>
    <style>
        .quiz-container { max-width: 600px; margin: 50px auto; padding: 20px; background: white; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .question { font-size: 20px; font-weight: bold; margin-bottom: 20px; }
        .btn-option { display: block; width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 5px; cursor: pointer; text-align: left; }
        .btn-option:hover { background: #f0f0f0; }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div id="question" class="question">Đang tải câu hỏi...</div>
        <div id="options"></div>
    </div>

    <script>
        let questions = []; // Sẽ load từ units.json
        let currentIdx = 0;

        // Giả sử bạn fetch dữ liệu từ file units.json đã soạn
        async function loadData() {
            const res = await fetch('../data/units.json'); // Đường dẫn tới file JSON của bạn
            const data = await res.json();
            // Lấy Unit 1 làm ví dụ
            questions = data.unit1.questions; 
            showQuestion();
        }

        function showQuestion() {
            const qData = questions[currentIdx];
            const qEl = document.getElementById('question');
            const optEl = document.getElementById('options');

            // SỬA LỖI Ở ĐÂY: Dùng qData.text thay vì qData.q
            qEl.innerText = `Câu ${currentIdx + 1}: ${qData.text}`;
            
            optEl.innerHTML = '';
            // SỬA LỖI Ở ĐÂY: Dùng qData.options thay vì qData.answers
            qData.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'btn-option';
                btn.innerText = opt;
                btn.onclick = () => {
                    if(i === qData.correct) alert("Chính xác!");
                    else alert("Sai rồi!");
                    currentIdx++;
                    if(currentIdx < questions.length) showQuestion();
                    else alert("Hoàn thành 20 câu!");
                };
                optEl.appendChild(btn);
            });
        }
        loadData();
    </script>
</body>
</html>
