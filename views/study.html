<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title><%= lesson.title %></title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .btn-home { 
            display: inline-block; padding: 10px 20px; background: #f8f9fa; 
            color: #333; text-decoration: none; border-radius: 8px; 
            margin-bottom: 20px; font-weight: bold; border: 1px solid #ddd;
        }
        .btn-home:hover { background: #e2e6ea; }
        .question-box { margin-bottom: 20px; padding: 15px; border-bottom: 1px solid #eee; }
        .btn-submit { background: #007bff; color: white; padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-size: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="btn-home">🏠 Quay về Trang chủ</a>

        <h2><%= lesson.title %></h2>
        <hr>

        <form id="quizForm">
            <% questions.forEach((q, index) => { %>
                <div class="question-box">
                    <p><strong>Câu <%= index + 1 %>:</strong> <%= q.text %></p>
                    <% q.options.forEach((opt, optIdx) => { %>
                        <label style="display: block; margin: 5px 0;">
                            <input type="radio" name="q<%= index %>" value="<%= optIdx %>" required> <%= opt %>
                        </label>
                    <% }) %>
                </div>
            <% }) %>
            <button type="submit" class="btn-submit">Nộp bài & Lưu điểm</button>
        </form>
    </div>

    <script>
        document.getElementById('quizForm').onsubmit = async (e) => {
            e.preventDefault();
            // Logic tính điểm của bạn ở đây...
            let scoreStr = "10/10"; // Ví dụ
            let percent = 100;
            
            await fetch('/save-score', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    lessonTitle: "<%= lesson.title %>",
                    score: scoreStr,
                    percentage: percent
                })
            });
            alert('Đã lưu điểm thành công!');
            window.location.href = '/';
        };
    </script>
</body>
</html>
