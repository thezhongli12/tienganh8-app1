<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài học - English 8</title>
    <style>
        body { font-family: sans-serif; background: #eef2f7; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .unit-box { background: white; padding: 20px; border-radius: 10px; cursor: pointer; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .unit-box:hover { background: #1a73e8; color: white; }
        #quiz-view { display: none; background: white; padding: 30px; border-radius: 15px; max-width: 700px; margin: auto; }
        .option { display: block; padding: 10px; border: 1px solid #ddd; margin: 5px 0; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="list-view">
        <h2 style="text-align:center">Danh sách 12 Unit bài học</h2>
        <div class="grid" id="unit-grid"></div>
    </div>

    <div id="quiz-view">
        <button onclick="location.reload()">← Quay lại</button>
        <h2 id="title"></h2>
        <div id="questions"></div>
        <button id="submit" style="width:100%; padding:15px; margin-top:20px; background:#34a853; color:white; border:none; cursor:pointer">NỘP BÀI</button>
        <h3 id="score" style="text-align:center"></h3>
    </div>

    <script>
        let allData = {};
        fetch('/api/questions').then(r => r.json()).then(data => {
            allData = data;
            const grid = document.getElementById('unit-grid');
            Object.keys(data).forEach(key => {
                grid.innerHTML += `<div class="unit-box" onclick="showQuiz('${key}')"><h3>${data[key].title}</h3></div>`;
            });
        });

        function showQuiz(key) {
            document.getElementById('list-view').style.display = 'none';
            document.getElementById('quiz-view').style.display = 'block';
            const unit = allData[key];
            document.getElementById('title').innerText = unit.title;
            const qBox = document.getElementById('questions');
            qBox.innerHTML = unit.questions.map((q, i) => `
                <p><b>Câu ${i+1}: ${q.question}</b></p>
                ${q.options.map((opt, j) => `<label class="option"><input type="radio" name="q${i}" value="${j}"> ${opt}</label>`).join('')}
            `).join('');

            document.getElementById('submit').onclick = () => {
                let s = 0;
                unit.questions.forEach((q, i) => {
                    const sel = document.querySelector(`input[name="q${i}"]:checked`);
                    if(sel && parseInt(sel.value) === q.correct) s++;
                });
                document.getElementById('score').innerText = `Kết quả: ${s}/${unit.questions.length} câu đúng!`;
            };
        }
    </script>
</body>
</html>
