<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Học Tập - English 8</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; margin: 0; }
        nav { background: #1a73e8; color: white; padding: 15px; margin-bottom: 20px; }
        .container { max-width: 900px; margin: auto; }
        .unit-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .unit-card { background: white; padding: 20px; border-radius: 12px; cursor: pointer; text-align: center; border: 1px solid #ddd; }
        .unit-card:hover { border-color: #1a73e8; }
        #quiz-area { background: white; padding: 30px; border-radius: 15px; display: none; }
        .option { display: block; padding: 10px; border: 1px solid #eee; margin: 5px 0; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <nav><b>ENGLISH 8</b> | <span id="user-name"></span></nav>
    <div class="container">
        <div id="list-view">
            <h2>Lựa chọn bài học:</h2>
            <div class="unit-grid" id="unit-container"></div>
        </div>
        <div id="quiz-area">
            <button onclick="location.reload()">← Quay lại</button>
            <h2 id="quiz-title"></h2>
            <div id="questions"></div>
            <button id="submit" style="width:100%; padding:15px; background:#34a853; color:white; border:none; border-radius:10px; cursor:pointer; font-weight:bold; margin-top:20px;">NỘP BÀI</button>
            <h3 id="result" style="text-align:center;"></h3>
        </div>
    </div>
    <script>
        let allQuestions = {};
        async function start() {
            const status = await fetch('/api/user-status').then(r => r.json());
            document.getElementById('user-name').innerText = status.username;
            allQuestions = await fetch('/api/questions').then(r => r.json());
            const container = document.getElementById('unit-container');
            for(let i=1; i<=12; i++) {
                const title = allQuestions[i] ? allQuestions[i].title : "Đang cập nhật...";
                container.innerHTML += `<div class="unit-card" onclick="openQuiz('${i}')"><h3>Unit ${i}</h3><p>${title}</p></div>`;
            }
        }
        function openQuiz(id) {
            const unit = allQuestions[id];
            if(!unit || !unit.questions) return alert("Chưa có câu hỏi!");
            document.getElementById('list-view').style.display = 'none';
            document.getElementById('quiz-area').style.display = 'block';
            document.getElementById('quiz-title').innerText = unit.title;
            document.getElementById('questions').innerHTML = unit.questions.map((q, i) => `
                <p><b>Câu ${i+1}: ${q.question}</b></p>
                ${q.options.map((opt, j) => `<label class="option"><input type="radio" name="q${i}" value="${j}"> ${opt}</label>`).join('')}
            `).join('');
            document.getElementById('submit').onclick = () => {
                let score = 0;
                unit.questions.forEach((q, i) => {
                    const sel = document.querySelector(`input[name="q${i}"]:checked`);
                    if(sel && parseInt(sel.value) === q.correct) score++;
                });
                document.getElementById('result').innerText = `Kết quả: ${score}/${unit.questions.length}`;
            };
        }
        start();
    </script>
</body>
</html>
