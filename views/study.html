<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8"><title>Luyện Tập</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
        .box { background: white; max-width: 600px; margin: 0 auto; padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .opt { display: block; width: 100%; padding: 15px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; cursor: pointer; text-align: left; }
        .opt:hover { background: #e7f3ff; border-color: #1a73e8; }
        .back { color: #d93025; text-decoration: none; font-weight: bold; display: block; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="box">
        <a href="/" class="back">← Quay về Menu</a>
        <h2 id="title">Đang tải...</h2>
        <div id="content"></div>
    </div>
    <script>
        const data = {
            "1": { t: "Unit 1: Leisure Activities", q: "I enjoy _______ crafts.", a: ["doing", "making", "playing"], c: 1 },
            "2": { t: "Unit 2: Life in the Countryside", q: "People in the village are _______ than in the city.", a: ["friendlier", "more friendly", "friendly"], c: 0 }
        };
        const u = new URLSearchParams(window.location.search).get('u') || "1";
        const lesson = data[u];
        const title = document.getElementById('title');
        const content = document.getElementById('content');

        if (lesson) {
            title.innerText = lesson.t;
            content.innerHTML = `<p><b>Câu hỏi:</b> ${lesson.q}</p>` + 
                lesson.a.map((opt, i) => `<button class="opt" onclick="alert('${i==lesson.c ? "Đúng rồi! 🎉" : "Sai rồi! ❌"}')">${opt}</button>`).join('');
        } else {
            title.innerText = "Unit " + u + " đang soạn thảo";
        }
    </script>
</body>
</html>
