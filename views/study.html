<div class="container">
    <div id="quiz-area" style="display:none;">
        <button onclick="window.location.href='/'">← Quay lại</button>
        <h2 id="quiz-title" style="color:#1a73e8; text-align:center;"></h2>
        <div id="questions-list"></div>
        <button id="submit-btn" style="width:100%; padding:15px; background:#34a853; color:white; border:none; border-radius:10px; cursor:pointer; font-weight:bold; margin-top:20px;">NỘP BÀI</button>
        <div id="result-box" style="text-align:center; margin-top:20px; font-size:22px; font-weight:bold; color:#1a73e8;"></div>
    </div>
</div>



<script>
    async function loadQuiz() {
        try {
            // 1. Tải toàn bộ câu hỏi
            const res = await fetch('/api/questions');
            const allData = await res.json();

            // 2. Lấy số Unit từ URL (?unit=1)
            const params = new URLSearchParams(window.location.search);
            const unitId = params.get('unit');

            if (unitId && allData[unitId]) {
                const unit = allData[unitId];
                document.getElementById('quiz-area').style.display = 'block';
                document.getElementById('quiz-title').innerText = unit.title;

                const qList = document.getElementById('questions-list');
                qList.innerHTML = unit.questions.map((q, i) => `
                    <div style="margin-bottom: 20px; padding: 15px; background: #f9f9f9; border-radius: 10px;">
                        <p><b>Câu ${i+1}: ${q.question}</b></p>
                        ${q.options.map((opt, j) => `
                            <label style="display:block; margin:5px 0; cursor:pointer;">
                                <input type="radio" name="q${i}" value="${j}"> ${opt}
                            </label>
                        `).join('')}
                    </div>
                `).join('');

                // 3. Xử lý nộp bài
                document.getElementById('submit-btn').onclick = () => {
                    let score = 0;
                    unit.questions.forEach((q, i) => {
                        const sel = document.querySelector(`input[name="q${i}"]:checked`);
                        if (sel && parseInt(sel.value) === q.correct) score++;
                    });
                    document.getElementById('result-box').innerText = `Kết quả: ${score}/${unit.questions.length} câu đúng!`;
                    window.scrollTo(0, document.body.scrollHeight);
                };
            } else {
                alert("Unit này chưa có nội dung!");
                window.location.href = '/';
            }
        } catch (e) {
            console.error(e);
            alert("Lỗi tải dữ liệu. Hãy kiểm tra file data/units.json!");
        }
    }
    loadQuiz();
</script>
