<!DOCTYPE html>
<html lang="vi">
<head><meta charset="UTF-8"><title>Đăng Ký</title></head>
<body style="text-align:center; padding-top:50px; font-family:sans-serif;">
    <h2>ĐĂNG KÝ TÀI KHOẢN</h2>
    <form id="regForm">
        <input type="text" id="user" placeholder="Tên đăng nhập (≥6 ký tự)" required><br><br>
        <input type="password" id="pass" placeholder="Mật khẩu (≥8 ký tự)" required><br><br>
        <button type="submit">Đăng Ký</button>
    </form>
    <script>
        document.getElementById('regForm').onsubmit = async (e) => {
            e.preventDefault();
            const res = await fetch('/api/register', { // Khớp với app.post('/api/register') của bạn
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('user').value,
                    password: document.getElementById('pass').value
                })
            });
            const data = await res.json();
            if (data.success) {
                alert("Đăng ký thành công!");
                window.location.href = "/login";
            } else {
                alert("Lỗi: " + data.message);
            }
        };
    </script>
</body>
</html>
