<!DOCTYPE html>
<html lang="vi">
<head><meta charset="UTF-8"><title>Đăng Ký</title></head>
<body style="text-align:center; padding-top:100px; font-family:sans-serif;">
    <h2>ĐĂNG KÝ TÀI KHOẢN</h2>
    <form id="regForm">
        <input type="text" id="u" placeholder="Tên đăng nhập" required><br><br>
        <input type="password" id="p" placeholder="Mật khẩu" required><br><br>
        <button type="submit">Đăng Ký</button>
    </form>
    <p><a href="/login">Đã có tài khoản? Đăng nhập</a></p>
    <script>
        document.getElementById('regForm').onsubmit = async (e) => {
            e.preventDefault();
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: document.getElementById('u').value, password: document.getElementById('p').value})
            });
            const data = await res.json();
            if(data.success) { alert("Thành công!"); window.location.href="/login"; }
            else { alert(data.message); }
        };
    </script>
</body>
</html>
