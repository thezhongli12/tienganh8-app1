<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng Ký - Tiếng Anh 8</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: #eef2f7; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 320px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #2196F3; color: white; border: none; border-radius: 8px; cursor: pointer; }
        .link { margin-top: 15px; font-size: 14px; }
        .link a { color: #4CAF50; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h2>ĐĂNG KÝ</h2>
        <input type="text" id="ru" placeholder="Tên đăng nhập mới">
        <input type="password" id="rp" placeholder="Mật khẩu">
        <button onclick="doReg()">TẠO TÀI KHOẢN</button>
        <div class="link">Đã có tài khoản? <a href="./login.html">Đăng nhập</a></div>
    </div>

    <script>
        function doReg() {
            const u = document.getElementById('ru').value.trim();
            const p = document.getElementById('rp').value.trim();
            if(!u || !p) return alert("Vui lòng nhập đủ!");
            if(localStorage.getItem(u)) return alert("Tên này đã có người dùng!");

            localStorage.setItem(u, JSON.stringify({password: p}));
            alert("Đăng ký xong! Hãy đăng nhập.");
            window.location.href = './login.html';
        }
    </script>
</body>
</html>
