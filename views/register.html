<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký thành viên</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f2f5; margin: 0; }
        .box { background: white; padding: 35px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 340px; }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 25px; }
        .input-group { margin-bottom: 15px; }
        .note { font-size: 11px; color: #7f8c8d; margin-bottom: 5px; display: block; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 14px; transition: 0.3s; }
        input:focus { border-color: #2ecc71; outline: none; box-shadow: 0 0 5px rgba(46, 204, 113, 0.3); }
        .error-container { min-height: 20px; margin: 10px 0; }
        .error-msg { color: #e74c3c; font-size: 13px; font-weight: bold; text-align: center; }
        button { width: 100%; padding: 13px; background: #2ecc71; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; }
        button:hover { background: #27ae60; }
        .footer-link { text-align: center; margin-top: 20px; font-size: 14px; color: #666; }
        .footer-link a { color: #3498db; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Tạo tài khoản</h2>
        <form action="/register" method="POST">
            <div class="input-group">
                <span class="note">* Tên đăng nhập (Tối đa 6 chữ/số, không dấu/cách)</span>
                <input type="text" name="username" placeholder="Nhập tên..." maxlength="6" required>
            </div>
            
            <div class="input-group">
                <span class="note">* Mật khẩu (Tối đa 8 ký tự)</span>
                <input type="password" name="password" placeholder="Nhập mật khẩu..." maxlength="8" required>
            </div>

            <div class="error-container">
                <% if (locals.error) { %>
                    <div class="error-msg">⚠️ <%= error %></div>
                <% } %>
            </div>

            <button type="submit">Đăng ký ngay</button>
        </form>
        <div class="footer-link">
            Đã có tài khoản? <a href="/login">Đăng nhập</a>
        </div>
    </div>
</body>
</html>
