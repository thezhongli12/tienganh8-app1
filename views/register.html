<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký thành viên - English 8</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f0f4f8; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 35px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 380px; }
        h2 { text-align: center; color: #2d8e47; margin-bottom: 25px; font-weight: 700; }
        .error { color: #d93025; background: #fff5f5; padding: 10px; border-radius: 8px; border: 1px solid #ffcfcf; font-size: 13px; display: none; margin-bottom: 15px; text-align: center; }
        .hint { font-size: 13px; color: #64748b; margin: 15px 0 5px 2px; font-weight: 600; }
        input { width: 100%; padding: 14px; margin-bottom: 5px; border: 1.5px solid #e2e8f0; border-radius: 10px; box-sizing: border-box; transition: 0.3s; font-size: 15px; }
        input:focus { border-color: #34a853; outline: none; box-shadow: 0 0 0 3px rgba(52, 168, 83, 0.1); }
        
        /* Style cho phần mật khẩu có icon */
        .pass-wrapper { position: relative; width: 100%; }
        .toggle-btn { position: absolute; right: 12px; top: 14px; cursor: pointer; font-size: 18px; user-select: none; }
        
        button { width: 100%; padding: 14px; background: #34a853; color: white; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; transition: 0.3s; margin-top: 20px; font-size: 16px; }
        button:hover { background: #2d8e47; transform: translateY(-1px); }
        .login-link { text-align: center; margin-top: 20px; font-size: 14px; color: #64748b; }
        .login-link a { color: #34a853; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="card">
        <h2>TẠO TÀI KHOẢN</h2>
        <div id="error-box" class="error"></div>
        <form id="regForm">
            <p class="hint">Tên đăng nhập (≥ 6 ký tự)</p>
            <input type="text" id="u" placeholder="Ví dụ: hocsinh2026" required>
            
            <p class="hint">Mật khẩu (≥ 8 ký tự)</p>
            <div class="pass-wrapper">
                <input type="password" id="p" placeholder="••••••••" required>
                <span class="toggle-btn" id="toggleP">👁️</span>
            </div>
            
            <button type="submit">ĐĂNG KÝ NGAY</button>
        </form>
        <p class="login-link">Đã có tài khoản? <a href="/login">Đăng nhập</a></p>
    </div>

    <script>
        // Xử lý ẩn/hiện mật khẩu
        const pInput = document.getElementById('p');
        const toggleBtn = document.getElementById('toggleP');

        toggleBtn.onclick = () => {
            const isPass = pInput.type === 'password';
            pInput.type = isPass ? 'text' : 'password';
            toggleBtn.textContent = isPass ? '🙈' : '👁️';
        };

        // Xử lý gửi form
        document.getElementById('regForm').onsubmit = async (e) => {
            e.preventDefault();
            const u = document.getElementById('u').value;
            const p = pInput.value;
            const errorBox = document.getElementById('error-box');

            if(u.length < 6 || p.length < 8) {
                errorBox.innerText = "⚠️ Tên đăng nhập hoặc mật khẩu quá ngắn!";
                errorBox.style.display = 'block';
                return;
            }

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: u, password: p})
                });
                const data = await res.json();
                
                if(data.success) {
                    alert("🎉 Đăng ký thành công!");
                    window.location.href = "/login";
                } else {
                    errorBox.innerText = "❌ " + data.message;
                    errorBox.style.display = 'block';
                }
            } catch(err) {
                errorBox.innerText = "Lỗi kết nối Server!";
                errorBox.style.display = 'block';
            }
        };
    </script>
</body>
</html>
