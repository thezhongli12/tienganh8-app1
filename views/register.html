<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Đăng ký</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f2f5; margin: 0; }
        .box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 320px; }
        input { width: 100%; padding: 12px; margin: 10px 0 5px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .error { color: #e74c3c; font-size: 13px; font-weight: bold; text-align: center; margin: 10px 0; }
        button { width: 100%; padding: 12px; background: #2ecc71; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="text-align: center;">Đăng ký</h2>
        <form action="/register" method="POST">
            <span style="font-size: 11px; color: gray;">* Tên đăng nhập (Ít nhất 6 ký tự)</span>
            <input type="text" name="username" placeholder="Username" minlength="6" required>
            
            <span style="font-size: 11px; color: gray;">* Mật khẩu (Ít nhất 8 ký tự)</span>
            <input type="password" name="password" placeholder="Password" minlength="8" required>

            <% if (locals.error) { %>
                <div class="error">⚠️ <%= error %></div>
            <% } %>

            <button type="submit">Đăng ký & Vào học</button>
        </form>
    </div>
</body>
</html>
