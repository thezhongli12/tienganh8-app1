<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký thành viên - English 8</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 350px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #34a853; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .error { color: #d93025; font-size: 13px; display: none; margin-bottom: 10px; }
        .hint { font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="text-align:center; color: #34a853;">ĐĂNG KÝ</h2>
        <div id="error-box" class="error"></div>
        <form id="regForm">
            <p class="hint">Tên đăng nhập (ít nhất 6 ký tự):</p>
            <input type="text" id="u" placeholder="Nhập tên đăng nhập" required>
            <p class="hint">Mật khẩu (ít nhất 8 ký tự):</p>
            <input type="password" id="p" placeholder="Nhập mật khẩu" required>
            <button type="submit">TẠO TÀI KHOẢN</button>
        </form>
        <p style="text-align:center; font-size:14px;">Đã có tài khoản? <a href="/login">Đăng nhập</a></p>
    </div>

    <script>
        document.getElementById('regForm').onsubmit = async (e) => {
            e.preventDefault();
            const u = document.getElementById('u').value;
            const p = document.getElementById('p').value;
            const errorBox = document.getElementById('error-box');

            if(u.length < 6 || p.length < 8) {
                errorBox.innerText = "Chưa đủ độ dài yêu cầu!";
                errorBox.style.display = 'block';
                return;
            }

            const res = await fetch('/api/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: u, password: p})
            });
            const data = await res.json();
            
            if(data.success) {
                alert("Đăng ký thành công! Hãy đăng nhập.");
                window.location.href = "/login";
            } else {
                errorBox.innerText = data.message;
                errorBox.style.display = 'block';
            }
        };
    </script>
</body>
</html>
