<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Đăng ký</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f2f5; margin: 0; }
        .box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 340px; }
        .note { font-size: 11px; color: #7f8c8d; margin-top: 5px; }
        input { width: 100%; padding: 12px; margin: 10px 0 5px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .err { color: #e74c3c; font-size: 13px; font-weight: bold; text-align: center; margin-bottom: 10px; }
        button { width: 100%; padding: 12px; background: #2ecc71; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="text-align: center;">Tạo tài khoản</h2>
        <form action="/register" method="POST">
            <span class="note">* Tên (Ít nhất 6 ký tự, không dấu/cách)</span>
            <input type="text" name="username" placeholder="Tên đăng nhập" minlength="6" required>
            
            <span class="note">* Mật khẩu (Ít nhất 8 ký tự)</span>
            <input type="password" name="password" placeholder="Mật khẩu" minlength="8" required>

            <% if (locals.error) { %>
                <div class="err">❌ <%= error %></div>
            <% } %>

            <button type="submit">Đăng ký ngay</button>
        </form>
        <p style="text-align: center; font-size: 14px;"><a href="/login" style="text-decoration:none; color:#3498db;">Quay lại đăng nhập</a></p>
    </div>
</body>
</html>
