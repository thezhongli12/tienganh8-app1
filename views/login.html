<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Tiếng Anh 8</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: #eef2f7; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 320px; text-align: center; }
        h2 { color: #333; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #4CAF50; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background: #45a049; }
        .link { margin-top: 15px; font-size: 14px; }
        .link a { color: #2196F3; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h2>ĐĂNG NHẬP</h2>
        <input type="text" id="u" placeholder="Tên đăng nhập">
        <input type="password" id="p" placeholder="Mật khẩu">
        <button onclick="doLogin()">VÀO HỌC</button>
        <div class="link">Chưa có tài khoản? <a href="./register.html">Đăng ký ngay</a></div>
    </div>

    <script>
        function doLogin() {
            const user = document.getElementById('u').value.trim();
            const pass = document.getElementById('p').value.trim();

            if(user === 'admin' && pass === '080212') {
                localStorage.setItem('currentUser', 'Admin');
                window.location.href = './index.html';
                return;
            }

            const data = localStorage.getItem(user);
            if(data) {
                const info = JSON.parse(data);
                if(info.password === pass) {
                    localStorage.setItem('currentUser', user);
                    window.location.href = './index.html';
                } else alert("Sai mật khẩu!");
            } else alert("Tài khoản không tồn tại!");
        }
    </script>
</body>
</html>
