<!DOCTYPE html>
<html lang="vi">
<head><meta charset="UTF-8"><title>Đăng Nhập</title></head>
<body style="text-align:center; padding-top:50px; font-family:sans-serif;">
    <h2>ĐĂNG NHẬP</h2>
    <form id="loginForm">
        <input type="text" id="user" placeholder="Tên đăng nhập" required><br><br>
        <input type="password" id="pass" placeholder="Mật khẩu" required><br><br>
        <button type="submit">Đăng Nhập</button>
    </form>
    <script>
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const res = await fetch('/api/login', { // Khớp với app.post('/api/login') của bạn
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('user').value,
                    password: document.getElementById('pass').value
                })
            });
            const data = await res.json();
            if (data.success) window.location.href = "/";
            else alert(data.message);
        };
    </script>
</body>
</html>
