<!DOCTYPE html>
<html lang="vi">
<head><meta charset="UTF-8"><title>Đăng Nhập - English 8</title>
<style>
    body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; background: #f1f5f9; margin: 0; }
    .form-box { background: white; padding: 2.5rem; border-radius: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 400px; }
    input { width: 100%; padding: 0.75rem; margin: 0.5rem 0 1.5rem 0; border: 1px solid #ddd; border-radius: 0.5rem; box-sizing: border-box; }
    button { width: 100%; padding: 0.75rem; background: #4f46e5; color: white; border: none; border-radius: 0.5rem; font-weight: bold; cursor: pointer; }
    .error-msg { color: #dc2626; background: #fef2f2; padding: 0.5rem; border-radius: 0.25rem; margin-bottom: 1rem; display: none; }
</style>
</head>
<body>
    <div class="form-box">
        <h2>Đăng nhập</h2>
        <div id="error" class="error-msg"></div>
        <form id="loginForm">
            <input type="text" id="u" placeholder="Tên đăng nhập" required>
            <input type="password" id="p" placeholder="Mật khẩu" required>
            <button type="submit">Vào học ngay</button>
        </form>
        <p style="text-align:center; margin-top:1rem;">Chưa có tài khoản? <a href="/register">Đăng ký ngay</a></p>
    </div>
    <script>
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const errDiv = document.getElementById('error');
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: document.getElementById('u').value, password: document.getElementById('p').value})
            });
            const data = await res.json();
            if(data.success) window.location.href = "/";
            else {
                errDiv.innerText = data.message;
                errDiv.style.display = 'block';
            }
        };
    </script>
</body>
</html>
