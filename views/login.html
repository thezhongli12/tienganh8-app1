<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - English 8</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; background: #f8fafc; margin: 0; }
        .form-box { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.05); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #4f46e5; margin-bottom: 30px; font-weight: 700; font-size: 24px; }
        .error-msg { color: #dc2626; background: #fef2f2; padding: 12px; border-radius: 10px; margin-bottom: 20px; display: none; text-align: center; font-size: 14px; border: 1px solid #fee2e2; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #475569; font-size: 14px; }
        
        .input-container { position: relative; width: 100%; margin-bottom: 20px; }
        input { width: 100%; padding: 14px; border: 1.5px solid #e2e8f0; border-radius: 10px; box-sizing: border-box; transition: 0.3s; font-size: 16px; }
        input:focus { border-color: #4f46e5; outline: none; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        .eye-icon { position: absolute; right: 12px; top: 14px; cursor: pointer; font-size: 18px; user-select: none; }
        
        button { width: 100%; padding: 14px; background: #4f46e5; color: white; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; transition: 0.3s; font-size: 16px; margin-top: 10px; }
        button:hover { background: #4338ca; transform: translateY(-1px); box-shadow: 0 5px 15px rgba(79, 70, 229, 0.2); }
        .reg-link { text-align: center; margin-top: 25px; font-size: 14px; color: #64748b; }
        .reg-link a { color: #4f46e5; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="form-box">
        <h2>Đăng nhập</h2>
        <div id="error" class="error-msg"></div>
        <form id="loginForm">
            <label>Tên đăng nhập</label>
            <div class="input-container">
                <input type="text" id="u" placeholder="Nhập tên tài khoản" required>
            </div>
            
            <label>Mật khẩu</label>
            <div class="input-container">
                <input type="password" id="p" placeholder="Nhập mật khẩu" required>
                <span class="eye-icon" id="toggleLoginP">👁️</span>
            </div>
            
            <button type="submit">VÀO HỌC NGAY</button>
        </form>
        <p class="reg-link">Chưa có tài khoản? <a href="/register">Đăng ký ngay</a></p>
    </div>

    <script>
        // Xử lý ẩn/hiện mật khẩu đăng nhập
        const loginPassInput = document.getElementById('p');
        const eyeIcon = document.getElementById('toggleLoginP');

        eyeIcon.onclick = () => {
            const isPass = loginPassInput.type === 'password';
            loginPassInput.type = isPass ? 'text' : 'password';
            eyeIcon.textContent = isPass ? '🙈' : '👁️';
        };

        // Xử lý đăng nhập
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const errDiv = document.getElementById('error');
            const btn = e.target.querySelector('button');
            
            btn.innerText = "Đang xử lý...";
            btn.disabled = true;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        username: document.getElementById('u').value, 
                        password: loginPassInput.value
                    })
                });
                const data = await res.json();
                
                if(data.success) {
                    window.location.href = "/";
                } else {
                    errDiv.innerText = "⚠️ " + data.message;
                    errDiv.style.display = 'block';
                    btn.innerText = "VÀO HỌC NGAY";
                    btn.disabled = false;
                }
            } catch(err) {
                errDiv.innerText = "❌ Lỗi kết nối Server!";
                errDiv.style.display = 'block';
                btn.disabled = false;
                btn.innerText = "VÀO HỌC NGAY";
            }
        };
    </script>
</body>
</html>
