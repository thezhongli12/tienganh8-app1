<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Tiếng Anh 8</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .login-card { 
            background: white; 
            padding: 40px; 
            border-radius: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
            width: 100%; 
            max-width: 350px; 
            text-align: center; 
        }
        h2 { color: #333; margin-bottom: 25px; font-size: 24px; }
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            box-sizing: border-box; 
            outline: none; 
            transition: 0.3s; 
        }
        input:focus { 
            border-color: #667eea; 
            box-shadow: 0 0 8px rgba(102, 126, 234, 0.3); 
        }
        button { 
            width: 100%; 
            padding: 12px; 
            background: #667eea; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold; 
            transition: 0.3s; 
            margin-top: 10px; 
        }
        button:hover { 
            background: #5a67d8; 
            transform: translateY(-2px); 
        }
        .footer-links { 
            margin-top: 25px; 
            font-size: 14px; 
            color: #666; 
        }
        .footer-links a { 
            color: #667eea; 
            text-decoration: none; 
            font-weight: bold; 
        }
        .footer-links a:hover { 
            text-decoration: underline; 
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>ENGLISH 8</h2>
        <form action="/login" method="POST">
            <input type="text" name="username" placeholder="Tên đăng nhập" required>
            <input type="password" name="password" placeholder="Mật khẩu" required>
            <button type="submit">Đăng nhập ngay</button>
        </form>
        
        <div class="footer-links">
            Chưa có tài khoản? <a href="/register">Đăng ký thành viên</a>
        </div>
    </div>
</body>
</html>
