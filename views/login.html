<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Tiếng Anh 8</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 350px;
            text-align: center;
        }
        h2 { color: #1a73e8; margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }
        button:hover { background-color: #1557b0; }
        .switch {
            margin-top: 15px;
            font-size: 14px;
            color: #666;
        }
        .switch a { color: #1a73e8; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="login-container">
    <h2>ĐĂNG NHẬP</h2>
    <input type="text" id="username" placeholder="Tên đăng nhập" required>
    <input type="password" id="password" placeholder="Mật khẩu" required>
    <button onclick="handleLogin()">Đăng Nhập</button>
    
    <div class="switch">
        Chưa có tài khoản? <a href="./register.html">Đăng ký ngay</a>
    </div>
</div>

<script>
    function handleLogin() {
        const userInp = document.getElementById('username').value.trim();
        const passInp = document.getElementById('password').value.trim();

        if (!userInp || !passInp) {
            alert("Vui lòng nhập đầy đủ tên đăng nhập và mật khẩu!");
            return;
        }

        // 1. Kiểm tra tài khoản Admin (Mật khẩu bạn lưu: 080212)
        if (userInp === 'admin' && passInp === '080212') {
            localStorage.setItem('currentUser', 'Admin');
            alert("Chào Admin! Đang chuyển hướng...");
            window.location.href = './index.html';
            return;
        }

        // 2. Lấy dữ liệu từ localStorage
        const storedData = localStorage.getItem(userInp);

        if (storedData) {
            const userData = JSON.parse(storedData);
            
            if (userData.password === passInp) {
                localStorage.setItem('currentUser', userInp);
                alert("Đăng nhập thành công!");
                window.location.href = './index.html';
            } else {
                // Báo lỗi khi sai mật khẩu
                alert("Sai mật khẩu! Vui lòng thử lại.");
            }
        } else {
            // Báo lỗi khi không tìm thấy tên đăng nhập
            alert("Tài khoản này chưa được đăng ký!");
        }
    }

    // Hỗ trợ bấm Enter để đăng nhập nhanh
    document.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            handleLogin();
        }
    });
</script>

</body>
</html>
