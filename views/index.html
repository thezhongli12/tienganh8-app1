<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tiếng Anh 8 - Menu</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; text-align: center; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; max-width: 1000px; margin: 20px auto; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .updating { opacity: 0.6; background: #fafafa; border: 1px dashed #ccc; }
        button { background: #1a73e8; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>
    <h1>CHƯƠNG TRÌNH TIẾNG ANH 8</h1>
    <div id="unit-grid" class="grid">Đang tải dữ liệu...</div>

    <script>
        async function loadMenu() {
            const grid = document.getElementById('unit-grid');
            try {
                // Sửa đường dẫn để tìm đúng file JSON từ thư mục views
                const res = await fetch('../data/units.json');
                const data = await res.json();
                grid.innerHTML = '';

                for (let i = 1; i <= 12; i++) {
                    const unitKey = `unit${i}`;
                    const hasData = data[unitKey] && data[unitKey].questions && data[unitKey].questions.length > 0;
                    
                    const card = document.createElement('div');
                    card.className = `card ${!hasData ? 'updating' : ''}`;
                    
                    if (hasData) {
                        card.innerHTML = `
                            <h3>Unit ${i}</h3>
                            <p>${data[unitKey].title || 'Luyện tập'}</p>
                            <button onclick="location.href='/study?u=${i}'">VÀO HỌC</button>
                        `;
                    } else {
                        card.innerHTML = `
                            <h3>Unit ${i}</h3>
                            <p style="color: #888;"><i>Đang cập nhật...</i></p>
                            <button disabled>Chưa mở</button>
                        `;
                    }
                    grid.appendChild(card);
                }
            } catch (e) {
                grid.innerHTML = "Lỗi tải dữ liệu. Hãy kiểm tra file JSON!";
            }
        }
        loadMenu();
    </script>
</body>
</html>
