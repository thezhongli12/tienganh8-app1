<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8"><title>Tiếng Anh 8 - Home</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f8f9fa; text-align: center; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-width: 1100px; margin: 0 auto; }
        .card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); height: 160px; display: flex; flex-direction: column; justify-content: space-between; }
        .btn { background: #1a73e8; color: white; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: bold; }
        .off { opacity: 0.6; background: #eee; }
    </style>
</head>
<body>
    <h1>CHƯƠNG TRÌNH TIẾNG ANH 8</h1>
    <div id="unit-grid" class="grid"></div>
    <script>
        const units = { 1: "Leisure Activities", 2: "Life in the Countryside", 3: "Teenagers", 4: "Ethnic Groups", 5: "Customs & Traditions", 6: "Lifestyles", 7: "Environment", 8: "Shopping", 9: "Natural Disasters" };
        const grid = document.getElementById('unit-grid');
        for (let i = 1; i <= 12; i++) {
            const title = units[i];
            const card = document.createElement('div');
            card.className = title ? 'card' : 'card off';
            card.innerHTML = `<h3>Unit ${i}</h3><p>${title || "Đang soạn..."}</p>` + 
                (title ? `<a href="/study?u=${i}" class="btn">VÀO HỌC</a>` : `<button class="btn" style="background:#ccc" disabled>CHƯA MỞ</button>`);
            grid.appendChild(card);
        }
    </script>
</body>
</html>
