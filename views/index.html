<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Học Tiếng Anh 8 - Trang Chủ</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f0f2f5; }
        nav { background: #1a73e8; color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; }
        .hero { text-align: center; padding: 60px 20px; background: white; }
        .btn-study { background: #34a853; color: white; padding: 15px 40px; border-radius: 30px; text-decoration: none; font-size: 20px; display: inline-block; margin-top: 20px; }
        .content-section { max-width: 1000px; margin: 40px auto; padding: 0 20px; display: none; }
        .unit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .unit-item { background: white; padding: 20px; border-radius: 12px; text-align: center; border: 1px solid #eee; cursor: pointer; transition: 0.3s; }
        .unit-item:hover { border-color: #1a73e8; background: #e8f0fe; }
    </style>
</head>
<body>
    <nav>
        <a href="/" style="color:white; text-decoration:none; font-weight:bold; font-size:24px;">ENGLISH 8</a>
        <div id="auth-zone"><a href="/login" style="color:white">Đăng nhập</a></div>
    </nav>
    <div class="hero">
        <h1>Chinh Phục Tiếng Anh Lớp 8</h1>
        <div id="action-zone"><a href="/login" class="btn-study">Đăng nhập để bắt đầu</a></div>
    </div>
    <div class="content-section" id="units-area">
        <h2 style="text-align: center; color: #5f6368;">Lộ trình học tập (12 Units)</h2>
        <div class="unit-grid" id="unit-preview"></div>
    </div>
    <script>
        async function checkStatus() {
            const res = await fetch('/api/user-status');
            const data = await res.json();
            if (data.loggedIn) {
                document.getElementById('auth-zone').innerHTML = `Chào, <b>${data.username}</b> | <a href="/logout" style="color:white">Thoát</a>`;
                document.getElementById('action-zone').innerHTML = `<a href="/study" class="btn-study">VÀO HỌC NGAY</a>`;
                document.getElementById('units-area').style.display = 'block';
                const grid = document.getElementById('unit-preview');
                for (let i = 1; i <= 12; i++) {
                    grid.innerHTML += `<div class="unit-item" onclick="location.href='/study'"><h3>Unit ${i}</h3><p>Nội dung SGK mới</p></div>`;
                }
            }
        }
        checkStatus();
    </script>
</body>
</html>
