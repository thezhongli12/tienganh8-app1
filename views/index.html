<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tiếng Anh 8</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; }
        header { background: #667eea; color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; }
        .container { padding: 30px 5%; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-top: 5px solid #667eea; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); }
        .btn { display: inline-block; margin-top: 10px; padding: 8px 15px; background: #667eea; color: white; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>
    <header>
        <h2>ENGLISH 8</h2>
        <div>Chào <strong><%= user.username %></strong> | <a href="/logout" style="color:white">Thoát</a></div>
    </header>
    <div class="container">
        <h1>Danh sách 12 Units</h1>
        <div class="grid">
            <% lessons.forEach(lesson => { %>
                <div class="card">
                    <h3><%= lesson.title %></h3>
                    <p><%= lesson.desc %></p>
                    <a href="/study/<%= lesson.id %>" class="btn">Bắt đầu học →</a>
                </div>
            <% }) %>
        </div>
    </div>
</body>
</html>
