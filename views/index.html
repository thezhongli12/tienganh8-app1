<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8"><title>Tiếng Anh 8</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding-top: 70px; }
        nav { background: white; height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; position: fixed; top: 0; width: 100%; box-shadow: 0 2px 5px rgba(0,0,0,0.1); box-sizing: border-box; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; padding: 20px; max-width: 1100px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center; }
        .btn { display: block; background: #1a73e8; color: white; padding: 10px; text-decoration: none; border-radius: 6px; margin-top: 10px; }
    </style>
</head>
<body>
    <nav>
        <b>TIẾNG ANH 8</b>
        <div><a href="/login">Đăng Nhập</a> | <a href="/register">Đăng Ký</a></div>
    </nav>
    <div id="grid" class="grid"></div>
    <script>
        const units = ["Leisure Activities", "Life in the Countryside", "Teenagers", "Ethnic Groups", "Customs", "Lifestyles", "Environment", "Shopping", "Disasters", "Communication", "Science", "Planets"];
        const g = document.getElementById('grid');
        units.forEach((name, i) => {
            g.innerHTML += `<div class="card"><h3>Unit ${i+1}</h3><p>${name}</p><a href="/study?u=${i+1}" class="btn">VÀO HỌC</a></div>`;
        });
    </script>
</body>
</html>
