<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English 8 - Trang Chủ</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f0f2f5; }
        nav { background: #1a73e8; color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; }
        .hero { text-align: center; padding: 60px 20px; background: white; border-bottom: 1px solid #eee; }
        .btn-study { background: #34a853; color: white; padding: 15px 40px; border-radius: 30px; text-decoration: none; font-size: 20px; display: inline-block; margin-top: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .content-section { max-width: 1100px; margin: 40px auto; padding: 0 20px; display: none; }
        .unit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .unit-item { background: white; padding: 30px; border-radius: 15px; text-align: center; border: 1px solid #eee; cursor: pointer; transition: 0.3s; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .unit-item:hover { transform: translateY(-5px); border-color: #1a73e8; background: #f8faff; }
    </style>
</head>
<body>

<nav>
    <a href="/" style="color:white; text-decoration:none; font-size:24px; font-weight:bold;">ENGLISH 8</a>
    <div id="auth-zone"><a href="/login" style="color:white; text-decoration:none;">Đăng nhập</a></div>
</nav>

<div class="hero">
    <h1>Chinh Phục Tiếng Anh Lớp 8</h1>
    <p>Hệ thống bài tập trắc nghiệm đầy đủ 12 Unit.</p>
    <div id="action-zone"><a href="/login" class="btn-study">Đăng nhập để bắt đầu</a></div>
</div>

<div class="content-section" id="main-content">
    <h2 style="text-align: center; color: #5f6368; margin-bottom: 30px;">Lộ trình học tập (12 Units)</h2>
    <div class="unit-grid" id="unit-preview"></div>
</div>

<script>
    function renderUnits() {
        const grid = document.getElementById('unit-preview');
        grid.innerHTML = ""; 
        for (let i = 1; i <= 12; i++) {
            // QUAN TRỌNG: Chuyển hướng kèm theo ?unit=X
            grid.innerHTML += `
                <div class="unit-item" onclick="window.location.href='/study?unit=${i}'">
                    <h3>Unit ${i}</h3>
                    <p style="font-size: 14px; color: #888; margin-top:10px;">Nội dung SGK mới</p>
                </div>
            `;
        }
    }

    async function checkStatus() {
        try {
            const res = await fetch('/api/user-status');
            const data = await res.json();
            if (data.loggedIn) {
                document.getElementById('auth-zone').innerHTML = `<span>Chào, <b>${data.username}</b></span> | <a href="/logout" style="color:white; text-decoration:none;">Thoát</a>`;
                document.getElementById('action-zone').innerHTML = `<a href="/study" class="btn-study">VÀO HỌC NGAY</a>`;
                document.getElementById('main-content').style.display = 'block';
                renderUnits();
            }
        } catch (e) { console.error("Lỗi kết nối server"); }
    }
    checkStatus();
</script>
</body>
</html>
