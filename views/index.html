<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học Tiếng Anh 8</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #f0f2f5; transition: background 0.5s ease; }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        
        /* Profile Section */
        .profile-card { background: rgba(255, 255, 255, 0.9); padding: 20px; border-radius: 15px; display: none; align-items: center; gap: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 30px; backdrop-filter: blur(5px); }
        .avatar-img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid #3b82f6; }
        .settings-btn { background: #3b82f6; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-size: 14px; }
        
        /* Modal cài đặt */
        #settings-form { display: none; margin-top: 15px; padding-top: 15px; border-top: 1px solid #ddd; }
        .input-group { margin-bottom: 10px; }
        .input-group input { padding: 8px; width: 250px; border: 1px solid #ccc; border-radius: 4px; }

        /* Unit & Dictionary */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .unit-card { background: white; padding: 20px; border-radius: 10px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; }
        th { background: #3b82f6; color: white; padding: 12px; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

<div class="container">
    <div id="profile-section" class="profile-card">
        <img id="display-avatar" src="" class="avatar-img">
        <div>
            <h2 style="margin:0">Chào, <span id="display-name">Người dùng</span>!</h2>
            <p id="role-tag" style="margin:5px 0; color: #666; font-size: 14px;"></p>
            <button class="settings-btn" onclick="toggleSettings()">⚙️ Cài đặt Profile</button>
            <a href="/logout" style="color: #ef4444; text-decoration: none; margin-left: 15px; font-size: 14px;">Đăng xuất</a>
        </div>
    </div>

    <div id="settings-form" class="profile-card" style="display:none; flex-direction: column; align-items: flex-start;">
        <h3>Tùy chỉnh cá nhân</h3>
        <div class="input-group">
            <label>Tên hiển thị:</label><br>
            <input type="text" id="edit-name" placeholder="Ví dụ: Anh Tuấn">
        </div>
        <div class="input-group">
            <label>Link Ảnh đại diện (URL):</label><br>
            <input type="text" id="edit-avatar" placeholder="https://link-anh.jpg">
        </div>
        <div class="input-group">
            <label>Link Hình nền (URL):</label><br>
            <input type="text" id="edit-bg" placeholder="https://link-hinh-nen.jpg">
        </div>
        <div>
            <button onclick="saveProfile()" style="background: #22c55e; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;">Lưu thay đổi</button>
            <button onclick="toggleSettings()" style="background: #94a3b8; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;">Hủy</button>
        </div>
    </div>

    <h1>Danh sách bài học (Units)</h1>
    <div id="unit-list" class="grid">
        </div>

    <h1>Từ điển tra cứu nhanh</h1>
    <table>
        <thead>
            <tr>
                <th>Tiếng Anh</th>
                <th>Nghĩa tiếng Việt</th>
            </tr>
        </thead>
        <tbody id="dict-list">
            <tr><td colspan="2" style="text-align:center;">Đang tải từ vựng...</td></tr>
        </tbody>
    </table>
</div>

<script>
    // 1. Kiểm tra trạng thái và nạp Profile
    async function init() {
        const res = await fetch('/api/user-status');
        const data = await res.json();
        
        if (data.loggedIn) {
            document.getElementById('profile-section').style.display = 'flex';
            document.getElementById('display-name').innerText = data.displayName;
            document.getElementById('display-avatar').src = data.avatarUrl;
            document.getElementById('role-tag').innerText = data.role === 'admin' ? '⭐ Quản trị viên' : 'Học sinh';
            
            if (data.bgUrl) {
                document.body.style.backgroundImage = `url('${data.bgUrl}')`;
                document.body.style.backgroundSize = "cover";
                document.body.style.backgroundAttachment = "fixed";
            }
            if (data.role === 'admin') {
                const adminLink = document.createElement('a');
                adminLink.href = '/admin';
                adminLink.innerText = '🛡️ Trang Admin';
                adminLink.style = 'display:block; margin-top:10px; color:#3b82f6; text-decoration:none; font-weight:bold;';
                document.getElementById('profile-section').querySelector('div').appendChild(adminLink);
            }
        }
        loadUnits();
        loadDictionary();
    }

    function toggleSettings() {
        const form = document.getElementById('settings-form');
        form.style.display = form.style.display === 'none' ? 'flex' : 'none';
    }

    async function saveProfile() {
        const payload = {
            displayName: document.getElementById('edit-name').value,
            avatarUrl: document.getElementById('edit-avatar').value,
            bgUrl: document.getElementById('edit-bg').value
        };
        const res = await fetch('/api/user/update-profile', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        if (res.ok) location.reload();
    }

    async function loadUnits() {
        const res = await fetch('/api/questions');
        const units = await res.json();
        const container = document.getElementById('unit-list');
        container.innerHTML = Object.keys(units).map(id => `
            <div class="unit-card">
                <h3>Unit ${id}</h3>
                <p>${units[id].title}</p>
                <a href="/study?unit=${id}" style="color:#3b82f6; font-weight:bold; text-decoration:none;">Bắt đầu học →</a>
            </div>
        `).join('');
    }

    async function loadDictionary() {
        const res = await fetch('/api/dictionary');
        const words = await res.json();
        document.getElementById('dict-list').innerHTML = words.map(w => `
            <tr>
                <td><b>${w.en}</b></td>
                <td>${w.vi}</td>
            </tr>
        `).join('');
    }

    window.onload = init;
</script>

</body>
</html>
