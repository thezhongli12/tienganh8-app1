<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tiếng Anh 8 - Trang Chủ</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding-top: 60px; text-align: center; }
        nav { background: #1a73e8; color: white; padding: 15px 30px; position: fixed; top: 0; width: 100%; display: flex; justify-content: space-between; box-sizing: border-box; }
        nav a { color: white; text-decoration: none; margin-left: 20px; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; padding: 20px; }
        .card { border: 1px solid #ddd; padding: 20px; border-radius: 10px; }
        .btn { background: #1a73e8; color: white; padding: 10px; text-decoration: none; border-radius: 5px; display: inline-block; }
    </style>
</head>
<body>
    <nav>
        <span>TIẾNG ANH 8</span>
        <div>
            <a href="/login">Đăng Nhập</a>
            <a href="/register">Đăng Ký</a>
        </div>
    </nav>

    <h1>Danh Sách Bài Học</h1>
    <div id="unit-grid" class="grid"></div>

    <script>
        const units = ["Leisure Activities", "Life in the Countryside", "Teenagers", "Ethnic Groups", "Customs", "Lifestyles", "Environment", "Shopping", "Disasters", "Communication", "Science", "Planets"];
        const grid = document.getElementById('unit-grid');
        units.forEach((u, i) => {
            grid.innerHTML += `<div class="card"><h3>Unit ${i+1}</h3><p>${u}</p><a href="/study?u=${i+1}" class="btn">Vào Học</a></div>`;
        });
    </script>
</body>
</html>
