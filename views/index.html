<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chủ - English 8</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #4f46e5; --admin: #856404; --bg: #f8fafc; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #1e293b; background-size: cover !important; background-attachment: fixed !important; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.9); padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 30px; backdrop-filter: blur(5px); }
        .user-box { display: flex; align-items: center; gap: 15px; }
        .avatar-img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); }
        #admin-section { display: none; background: #fff3cd; border: 1px dashed #ffeeba; padding: 15px; border-radius: 12px; margin-bottom: 20px; }
        .unit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .unit-card { background: white; padding: 20px; border-radius: 15px; border: 1px solid #e2e8f0; transition: 0.3s; cursor: pointer; text-decoration: none; color: inherit; }
        .unit-card:hover { transform: translateY(-5px); border-color: var(--primary); }
        .dictionary-card { background: rgba(255,255,255,0.9); padding: 25px; border-radius: 15px; border: 1px solid #e2e8f0; backdrop-filter: blur(5px); }
        .vocab-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; }
        .unit-group-header td { background: #eef2ff; font-weight: 800; color: #4338ca; padding: 12px 20px; }
        .vocab-table td { padding: 14px 20px; border-bottom: 1px solid #f1f5f9; }
        .btn { padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; text-decoration: none; font-size: 14px; }
        .btn-logout { background: #fee2e2; color: #dc2626; }
        #settings-modal { display: none; background: white; padding: 20px; border-radius: 15px; border: 1px solid #ddd; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="user-box">
            <img id="display-avatar" src="" class="avatar-img">
            <div>
                <span style="font-size: 14px; color: #64748b;">Xin chào,</span>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <div class="username" id="display-name" style="font-weight:700; color:var(--primary);">...</div>
                    <button onclick="document.getElementById('settings-modal').style.display='block'" style="border:none; background:none; cursor:pointer;">⚙️</button>
                </div>
            </div>
        </div>
        <a href="/logout" class="btn btn-logout">Đăng xuất</a>
    </div>

    <div id="settings-modal">
        <h3>Tùy chỉnh cá nhân</h3>
        <input type="text" id="edit-name" placeholder="Tên hiển thị..." style="width:90%; padding:8px; margin-bottom:10px;">
        <input type="text" id="edit-avatar" placeholder="Link ảnh đại diện..." style="width:90%; padding:8px; margin-bottom:10px;">
        <input type="text" id="edit-bg" placeholder="Link hình nền..." style="width:90%; padding:8px; margin-bottom:15px;">
        <br>
        <button class="btn" style="background:var(--primary); color:white;" onclick="saveProfile()">Lưu</button>
        <button class="btn" onclick="document.getElementById('settings-modal').style.display='none'">Hủy</button>
    </div>

    <div id="admin-section">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div><strong>🛠️ Quản trị viên</strong></div>
            <a href="/admin" class="btn" style="background:var(--admin); color:white;">Vào Quản Lý</a>
        </div>
    </div>

    <h2>📚 Danh sách bài học</h2>
    <div class="unit-grid" id="unit-list"></div>

    <div class="dictionary-card">
        <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
            <h2 style="margin:0">📖 Từ điển nhanh</h2>
            <input type="text" id="dict-search" placeholder="Tìm kiếm..." oninput="renderDictionary()" style="padding:8px; border-radius:8px; border:1px solid #ddd;">
        </div>
        <div style="overflow-x: auto;">
            <table class="vocab-table">
                <tbody id="vocab-body"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let globalDictionary = {};

    async function init() {
        const res = await fetch('/api/user-status');
        const data = await res.json();
        if (!data.loggedIn) return window.location.href = '/login';

        document.getElementById('display-name').innerText = data.displayName;
        document.getElementById('display-avatar').src = data.avatarUrl;
        if (data.bgUrl) document.body.style.backgroundImage = `url('${data.bgUrl}')`;
        if (data.role === 'admin') document.getElementById('admin-section').style.display = 'block';

        const resUnits = await fetch('/api/questions');
        const units = await resUnits.json();
        document.getElementById('unit-list').innerHTML = Object.keys(units).map(k => `
            <a href="/study?unit=${k}" class="unit-card"><h3>${units[k].title}</h3><p>Bấm để học.</p></a>
        `).join('');

        const resDict = await fetch('/api/dictionary');
        globalDictionary = await resDict.json();
        renderDictionary();
    }

    async function saveProfile() {
        const payload = {
            displayName: document.getElementById('edit-name').value,
            avatarUrl: document.getElementById('edit-avatar').value,
            bgUrl: document.getElementById('edit-bg').value
        };
        await fetch('/api/user/update-profile', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        location.reload();
    }

    function renderDictionary() {
        const search = document.getElementById('dict-search').value.toLowerCase();
        let html = '';
        Object.keys(globalDictionary).forEach(unit => {
            const filtered = globalDictionary[unit].filter(i => i[0].toLowerCase().includes(search) || i[1].toLowerCase().includes(search));
            if (filtered.length > 0) {
                html += `<tr class="unit-group-header"><td colspan="2">UNIT ${unit}</td></tr>`;
                filtered.forEach(i => html += `<tr><td><b>${i[0]}</b></td><td>${i[1]}</td></tr>`);
            }
        });
        document.getElementById('vocab-body').innerHTML = html || '<tr><td>Không tìm thấy</td></tr>';
    }

    window.onload = init;
</script>
</body>
</html>
