<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học Tiếng Anh 8 - Trang Chủ</title>
    <style>
        /* GIỮ NGUYÊN STYLE CỦA BẠN */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #f0f2f5; }
        nav { background: #1a73e8; color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .logo { font-size: 24px; font-weight: bold; text-decoration: none; color: white; }
        .nav-links a { color: white; text-decoration: none; margin-left: 15px; font-weight: 500; transition: 0.3s; }
        .nav-links a:hover { opacity: 0.8; }
        
        .hero { text-align: center; padding: 80px 20px; background: white; margin-bottom: 20px; }
        .hero h1 { color: #1a73e8; font-size: 42px; }
        .btn-study { background: #34a853; color: white; padding: 15px 40px; border-radius: 30px; text-decoration: none; font-size: 20px; display: inline-block; margin-top: 20px; box-shadow: 0 4px 15px rgba(52, 168, 83, 0.3); border: none; cursor: pointer; }

        /* PHẦN HIỂN THỊ UNIT */
        .content-section { max-width: 1100px; margin: 40px auto; padding: 0 20px; display: none; } /* Ẩn mặc định */
        .unit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-top: 30px; }
        .unit-item { background: white; padding: 30px; border-radius: 15px; text-align: center; border: 1px solid #eee; transition: 0.3s; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .unit-item:hover { transform: translateY(-5px); border-color: #1a73e8; cursor: pointer; }
        .unit-item h3 { color: #333; margin: 0; }
        
        /* Badge dành cho Admin khi dùng pass 080212 */
        .badge-admin { background: #fbbc05; color: black; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-right: 5px; }
    </style>
</head>
<body>

<nav>
    <a href="/" class="logo">ENGLISH 8</a>
    <div class="nav-links" id="auth-zone">
        <a href="/login">Đăng nhập</a>
        <a href="/register">Đăng ký</a>
    </div>
</nav>

<div class="hero">
    <h1>Chinh Phục Tiếng Anh Lớp 8</h1>
    <p>Hệ thống bài tập trắc nghiệm đầy đủ 12 Unit theo chương trình mới.</p>
    <div id="action-zone">
        <a href="/login" class="btn-study">Đăng nhập để bắt đầu</a>
    </div>
</div>

<div class="content-section" id="units-area">
    <h2 style="text-align: center; color: #5f6368;">Lộ trình học tập (12 Units)</h2>
    <div class="unit-grid" id="unit-preview"></div>
</div>

<script>
    // 1. Hàm tạo 12 ô Unit
    function renderUnits() {
        const grid = document.getElementById('unit-preview');
        grid.innerHTML = ""; 
        for (let i = 1; i <= 12; i++) {
            grid.innerHTML += `
                <div class="unit-item" onclick="window.location.href='/study'">
                    <h3>Unit ${i}</h3>
                    <p style="font-size: 14px; color: #888; margin-top:10px;">Nội dung SGK mới</p>
                </div>
            `;
        }
    }

    // 2. Kiểm tra trạng thái đăng nhập từ app.js
    async function checkUserStatus() {
        try {
            const res = await fetch('/api/user-status');
            const data = await res.json();
            
            const authZone = document.getElementById('auth-zone');
            const actionZone = document.getElementById('action-zone');
            const unitsArea = document.getElementById('units-area');

            if (data.loggedIn) {
                // Nếu đã đăng nhập
                let adminTag = data.role === 'admin' ? '<span class="badge-admin">ADMIN</span> ' : '';
                let adminLink = data.role === 'admin' ? '<a href="/admin-dashboard" style="color:#fbbc05">★ QUẢN LÝ</a>' : '';
                
                authZone.innerHTML = `
                    <span>${adminTag}Chào, <b>${data.username}</b></span>
                    ${adminLink}
                    <a href="/logout" style="background:rgba(255,255,255,0.2); padding:5px 10px; border-radius:5px">Thoát</a>
                `;

                actionZone.innerHTML = `<a href="/study" class="btn-study">VÀO HỌC NGAY</a>`;
                
                // Hiển thị phần 12 Units
                unitsArea.style.display = 'block'; 
                renderUnits();
            } else {
                // Nếu chưa đăng nhập: Ẩn phần Unit, hiện nút yêu cầu đăng nhập
                unitsArea.style.display = 'none';
                authZone.innerHTML = `<a href="/login">Đăng nhập</a> <a href="/register">Đăng ký</a>`;
                actionZone.innerHTML = `<a href="/login" class="btn-study">Đăng nhập để bắt đầu</a>`;
            }
        } catch (e) {
            console.log("Lỗi kết nối hoặc Internal Server Error");
        }
    }

    checkUserStatus();
</script>

</body>
</html>
