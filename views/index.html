<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chủ - English 8</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #4f46e5; --admin: #856404; --bg: #f8fafc; }
        /* Cập nhật body để hỗ trợ hình nền tùy chỉnh */
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg); 
            margin: 0; 
            padding: 20px; 
            color: #1e293b; 
            background-size: cover !important; 
            background-attachment: fixed !important;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.9); padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 30px; backdrop-filter: blur(5px); }
        .user-box { display: flex; align-items: center; gap: 15px; }
        .username { font-weight: 700; color: var(--primary); }
        
        /* CSS cho Ảnh đại diện */
        .avatar-box { position: relative; width: 50px; height: 50px; }
        #display-avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); }

        #admin-section { display: none; background: #fff3cd; border: 1px dashed #ffeeba; padding: 15px; border-radius: 12px; margin-bottom: 20px; }
        .unit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .unit-card { background: white; padding: 20px; border-radius: 15px; border: 1px solid #e2e8f0; transition: 0.3s; cursor: pointer; text-decoration: none; color: inherit; }
        .unit-card:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        
        /* Dictionary & Table Styles */
        .dictionary-card { background: rgba(255, 255, 255, 0.9); padding: 25px; border-radius: 15px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); backdrop-filter: blur(5px); }
        .dict-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #f1f5f9; padding-bottom: 15px; flex-wrap: wrap; gap: 15px; }
        .vocab-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; }
        .search-box { padding: 8px 12px; border-radius: 8px; border: 1px solid #d1d5db; outline: none; min-width: 200px; }
        .unit-group-header td { background: #eef2ff; font-weight: 800; color: #4338ca; padding: 12px 20px; }
        .table-main-header th { text-align: left; padding: 12px 20px; color: #64748b; font-weight: 600; background: #fafafa; }
        .vocab-table td { padding: 14px 20px; border-bottom: 1px solid #f1f5f9; }

        .btn { padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; text-decoration: none; font-size: 14px; }
        .btn-logout { background: #fee2e2; color: #dc2626; }
        .btn-settings { background: #e0e7ff; color: #4338ca; border: none; margin-left: 10px; }

        /* Form chỉnh sửa Profile */
        #settings-modal { display: none; background: white; padding: 20px; border-radius: 15px; border: 1px solid #e2e8f0; margin-bottom: 25px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .modal-input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="user-box">
            <div class="avatar-box">
                <img id="display-avatar" src="https://ui-avatars.com/api/?name=User" alt="Avatar">
            </div>
            <div>
                <span style="font-size: 14px; color: #64748b;">Xin chào,</span>
                <div style="display: flex; align-items: center;">
                    <div class="username" id="display-name">Đang tải...</div>
                    <button class="btn btn-settings" onclick="document.getElementById('settings-modal').style.display='block'">⚙️</button>
                </div>
            </div>
        </div>
        <a href="/logout" class="btn btn-logout">Đăng xuất</a>
    </div>

    <div id="settings-modal">
        <h3 style="margin-top:0">Cài đặt cá nhân</h3>
        <input type="text" id="edit-name" class="modal-input" placeholder="Tên hiển thị mới...">
        <input type="text" id="edit-avatar" class="modal-input" placeholder="Link ảnh đại diện (URL)...">
        <input type="text" id="edit-bg" class="modal-input" placeholder="Link hình nền (URL)...">
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button class="btn" style="background:var(--primary); color:white;" onclick="saveProfile()">Lưu thay đổi</button>
            <button class="btn" style="background:#f1f5f9; color:#64748b;" onclick="document.getElementById('settings-modal').style.display='none'">Hủy</button>
        </div>
    </div>

    <div id="admin-section">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div><strong>🛠️ Quản trị viên</strong></div>
            <a href="/admin" class="btn" style="background:var(--admin); color:white;">Vào Quản Lý</a>
        </div>
    </div>

    <h2>📚 Danh sách bài học</h2>
    <div class="unit-grid" id="unit-list"></div>

    <div class="dictionary-card">
        <div class="dict-header">
            <h2 style="margin:0; font-size: 1.25rem; display: flex; align-items: center; gap: 10px;">
                <span>📖</span> Từ điển tra cứu nhanh
            </h2>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <input type="text" id="dict-search" class="search-box" placeholder="Tìm kiếm từ vựng..." oninput="renderDictionary()">
                <select id="dict-filter" style="padding:8px 12px; border-radius:8px; border: 1px solid #d1d5db; outline: none;" onchange="renderDictionary()">
                    <option value="all">Tất cả bài học</option>
                </select>
            </div>
        </div>
        <div style="overflow-x: auto; border-radius: 10px; border: 1px solid #f1f5f9;">
            <table class="vocab-table">
                <thead>
                    <tr class="table-main-header">
                        <th style="width: 40%;">Tiếng Anh</th>
                        <th>Nghĩa tiếng Việt</th>
                    </tr>
                </thead>
                <tbody id="vocab-body"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let globalDictionary = {};

    async function initPage() {
        try {
            const resStatus = await fetch('/api/user-status');
            const userData = await resStatus.json();
            if (!userData.loggedIn) return window.location.href = '/login';
            
            // Cập nhật Profile (Tên, Avatar, Hình nền)
            document.getElementById('display-name').innerText = userData.displayName || userData.username;
            if (userData.avatarUrl) document.getElementById('display-avatar').src = userData.avatarUrl;
            if (userData.bgUrl) document.body.style.background = `url('${userData.bgUrl}')`;

            if (userData.role === 'admin') document.getElementById('admin-section').style.display = 'block';

            const resUnits = await fetch('/api/questions');
            const units = await resUnits.json();
            const sortedUnitKeys = Object.keys(units).sort((a, b) => parseInt(a) - parseInt(b));
            
            document.getElementById('unit-list').innerHTML = sortedUnitKeys.map(key => `
                <a href="/study?unit=${key}" class="unit-card">
                    <h3>${units[key].title}</h3>
                    <p style="font-size: 13px; color: #64748b;">Bấm để làm bài tập.</p>
                </a>`).join('');

            const resDict = await fetch('/api/dictionary');
            globalDictionary = await resDict.json();
            
            const filter = document.getElementById('dict-filter');
            Object.keys(globalDictionary).sort((a,b) => parseInt(a) - parseInt(b)).forEach(key => {
                const opt = document.createElement('option');
                opt.value = key;
                opt.textContent = `Unit ${key}`;
                filter.appendChild(opt);
            });

            renderDictionary();
        } catch (err) { 
            console.error(err);
            document.getElementById('vocab-body').innerHTML = '<tr><td colspan="2" style="text-align:center; color:red; padding:20px;">Lỗi tải dữ liệu.</td></tr>';
        }
    }

    // PHẦN MỚI: Hàm lưu Profile
    async function saveProfile() {
        const payload = {
            displayName: document.getElementById('edit-name').value,
            avatarUrl: document.getElementById('edit-avatar').value,
            bgUrl: document.getElementById('edit-bg').value
        };

        const res = await fetch('/api/user/update-profile', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });

        if (res.ok) location.reload();
        else alert("Lỗi khi cập nhật!");
    }

    function renderDictionary() {
        const filterValue = document.getElementById('dict-filter').value;
        const searchValue = document.getElementById('dict-search').value.toLowerCase().trim();
        const tbody = document.getElementById('vocab-body');
        let html = '';
        let hasResults = false;

        Object.keys(globalDictionary).sort((a,b) => parseInt(a) - parseInt(b)).forEach(unitKey => {
            if (filterValue === 'all' || filterValue === unitKey) {
                const filteredVocab = globalDictionary[unitKey].filter(item => 
                    item[0].toLowerCase().includes(searchValue) || 
                    item[1].toLowerCase().includes(searchValue)
                );

                if (filteredVocab.length > 0) {
                    hasResults = true;
                    html += `<tr class="unit-group-header"><td colspan="2">UNIT ${unitKey}</td></tr>`;
                    filteredVocab.forEach(item => {
                        html += `
                            <tr>
                                <td style="font-weight:700; color:var(--primary); font-size: 15px;">${item[0]}</td>
                                <td style="color: #475569;">${item[1]}</td>
                            </tr>
                        `;
                    });
                }
            }
        });
        tbody.innerHTML = hasResults ? html : '<tr><td colspan="2" style="text-align:center; padding: 40px; color: #64748b;">🔍 Không tìm thấy từ vựng nào.</td></tr>';
    }

    initPage();
</script>
</body>
</html>
