<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiếng Anh 8 - Menu</title>
    <style>
        :root { --blue: #1a73e8; --bg: #f1f3f4; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); margin: 0; padding: 20px; text-align: center; }
        h1 { color: var(--blue); text-transform: uppercase; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-width: 1100px; margin: 0 auto; }
        .card { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); transition: 0.3s; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid #e0e0e0; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.15); }
        .card.off { opacity: 0.6; background: #fafafa; border-style: dashed; }
        h3 { margin: 0 0 10px 0; color: #333; }
        p { color: #666; font-size: 0.9em; margin-bottom: 20px; }
        .btn { background: var(--blue); color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; text-decoration: none; display: block; }
        .btn:disabled { background: #bdc1c6; cursor: not-allowed; }
    </style>
</head>
<body>

    <h1>Chương Trình Tiếng Anh 8</h1>
    <div id="unit-grid" class="grid"></div>

    <script>
        // DÁN TRỰC TIẾP DỮ LIỆU VÀO ĐÂY ĐỂ TRÁNH LỖI KẾT NỐI
        const unitData = {
            "unit1": { "title": "Leisure Activities", "questions": [1] },
            "unit2": { "title": "Life in the Countryside", "questions": [1] },
            "unit3": { "title": "Teenagers", "questions": [1] },
            "unit4": { "title": "Ethnic Groups of Vietnam", "questions": [1] },
            "unit5": { "title": "Our Customs and Traditions", "questions": [1] },
            "unit6": { "title": "Lifestyles", "questions": [1] },
            "unit7": { "title": "Environmental Protection", "questions": [1] },
            "unit8": { "title": "Shopping", "questions": [1] },
            "unit9": { "title": "Natural Disasters", "questions": [1] }
            // Unit 10, 11, 12 không có dữ liệu sẽ tự hiện "Đang cập nhật"
        };

        function renderMenu() {
            const grid = document.getElementById('unit-grid');
            grid.innerHTML = '';

            for (let i = 1; i <= 12; i++) {
                const key = `unit${i}`;
                const info = unitData[key];
                const isReady = info && info.questions && info.questions.length > 0;
                
                const card = document.createElement('div');
                card.className = isReady ? 'card' : 'card off';
                
                if (isReady) {
                    card.innerHTML = `
                        <div>
                            <h3>Unit ${i}</h3>
                            <p>${info.title}</p>
                        </div>
                        <a href="/study?u=${i}" class="btn">VÀO HỌC</a>
                    `;
                } else {
                    card.innerHTML = `
                        <div>
                            <h3>Unit ${i}</h3>
                            <p><i>Đang cập nhật nội dung...</i></p>
                        </div>
                        <button class="btn" disabled>CHƯA MỞ</button>
                    `;
                }
                grid.appendChild(card);
            }
        }

        renderMenu();
    </script>
</body>
</html>
