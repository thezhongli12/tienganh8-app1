<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chủ - English 8</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #4f46e5; --admin: #856404; --bg: #f8fafc; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #1e293b; }
        .container { max-width: 900px; margin: 0 auto; }
        
        /* Header & User Info */
        .header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 30px; }
        .user-box { display: flex; align-items: center; gap: 15px; }
        .username { font-weight: 700; color: var(--primary); }
        
        /* Admin Section - Mặc định ẩn */
        #admin-section { 
            display: none; 
            background: #fff3cd; 
            border: 1px dashed #ffeeba; 
            padding: 15px; 
            border-radius: 12px; 
            margin-bottom: 20px; 
            animation: slideDown 0.5s ease;
        }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        /* Unit List */
        .unit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .unit-card { background: white; padding: 20px; border-radius: 15px; border: 1px solid #e2e8f0; transition: 0.3s; cursor: pointer; text-decoration: none; color: inherit; }
        .unit-card:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .unit-card h3 { margin: 0 0 10px 0; color: #334155; }
        
        /* Buttons */
        .btn { padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; text-decoration: none; font-size: 14px; }
        .btn-logout { background: #fee2e2; color: #dc2626; }
        .btn-admin { background: var(--admin); color: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="user-box">
            <div style="background: #e0e7ff; padding: 10px; border-radius: 50%;">👤</div>
            <div>
                <span style="font-size: 14px; color: #64748b;">Xin chào,</span>
                <div class="username" id="display-name">Đang tải...</div>
            </div>
        </div>
        <a href="/logout" class="btn btn-logout">Đăng xuất</a>
    </div>

    <div id="admin-section">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <strong style="color: #856404;">🛠️ Chế độ Quản trị viên</strong>
                <p style="margin: 5px 0 0 0; font-size: 13px;">Bạn có quyền quản lý nội dung và học sinh.</p>
            </div>
            <a href="/admin" class="btn btn-admin">Vào Quản Lý</a>
        </div>
    </div>

    <h2 style="margin-bottom: 20px;">📚 Danh sách bài học</h2>

    <div class="unit-grid" id="unit-list">
        </div>
</div>



<script>
    // Hàm kiểm tra đăng nhập và phân quyền (Giữ logic cũ của bạn)
    async function initPage() {
        try {
            // Gọi API kiểm tra status (Đã sửa trong app.js để có role)
            const resStatus = await fetch('/api/user-status');
            const userData = await resStatus.json();

            if (!userData.loggedIn) {
                window.location.href = '/login';
                return;
            }

            // Hiện tên người dùng
            document.getElementById('display-name').innerText = userData.username;

            // KIỂM TRA ROLE ADMIN ĐỂ HIỆN PHẦN QUẢN LÝ
            if (userData.role === 'admin') {
                document.getElementById('admin-section').style.display = 'block';
            }

            // Load danh sách bài học (Giữ logic cũ của bạn)
            const resUnits = await fetch('/api/questions');
            const units = await resUnits.json();
            const listDiv = document.getElementById('unit-list');

            listDiv.innerHTML = Object.keys(units).map(key => `
                <a href="/study?unit=${key}" class="unit-card">
                    <h3>${units[key].title}</h3>
                    <p style="font-size: 13px; color: #64748b;">Nhấn để bắt đầu ôn tập bài học này.</p>
                </a>
            `).join('');

        } catch (err) {
            console.error("Lỗi tải trang:", err);
        }
    }

    initPage();
</script>

</body>
</html>
