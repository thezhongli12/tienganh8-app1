<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chủ - English 8</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #4f46e5; --admin: #856404; --bg: #f8fafc; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #1e293b; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 30px; }
        .user-box { display: flex; align-items: center; gap: 15px; }
        .username { font-weight: 700; color: var(--primary); }
        #admin-section { display: none; background: #fff3cd; border: 1px dashed #ffeeba; padding: 15px; border-radius: 12px; margin-bottom: 20px; }
        .unit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .unit-card { background: white; padding: 20px; border-radius: 15px; border: 1px solid #e2e8f0; transition: 0.3s; cursor: pointer; text-decoration: none; color: inherit; }
        .unit-card:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        
        /* Bảng từ vựng gom nhóm */
        .dictionary-card { background: white; padding: 25px; border-radius: 15px; border: 1px solid #e2e8f0; }
        .dict-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .vocab-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .unit-group-header { background: #f1f5f9; font-weight: 700; color: var(--primary); text-transform: uppercase; }
        .unit-group-header td { padding: 12px 15px; border-left: 4px solid var(--primary); }
        .vocab-table td { padding: 12px; border-bottom: 1px solid #f1f5f9; }
        .btn { padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; text-decoration: none; font-size: 14px; }
        .btn-logout { background: #fee2e2; color: #dc2626; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="user-box">
            <div style="background: #e0e7ff; padding: 10px; border-radius: 50%;">👤</div>
            <div>
                <span style="font-size: 14px; color: #64748b;">Xin chào,</span>
                <div class="username" id="display-name">Đang tải...</div>
            </div>
        </div>
        <a href="/logout" class="btn btn-logout">Đăng xuất</a>
    </div>

    <div id="admin-section">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div><strong>🛠️ Quản trị viên</strong></div>
            <a href="/admin" class="btn" style="background:var(--admin); color:white;">Vào Quản Lý</a>
        </div>
    </div>

    <h2>📚 Danh sách bài học</h2>
    <div class="unit-grid" id="unit-list"></div>

    <div class="dictionary-card">
        <div class="dict-header">
            <h2 style="margin:0;">📖 Từ điển theo Unit</h2>
            <select id="dict-filter" style="padding:8px; border-radius:8px;" onchange="renderDictionary()">
                <option value="all">Tất cả Unit</option>
            </select>
        </div>
        <table class="vocab-table">
            <thead>
                <tr style="text-align: left; color: #64748b;">
                    <th>Từ vựng</th>
                    <th>Nghĩa tiếng Việt</th>
                </tr>
            </thead>
            <tbody id="vocab-body"></tbody>
        </table>
    </div>
</div>

<script>
    let globalDictionary = {};

    async function initPage() {
        try {
            const resStatus = await fetch('/api/user-status');
            const userData = await resStatus.json();
            if (!userData.loggedIn) return window.location.href = '/login';
            document.getElementById('display-name').innerText = userData.username;
            if (userData.role === 'admin') document.getElementById('admin-section').style.display = 'block';

            const resUnits = await fetch('/api/questions');
            const units = await resUnits.json();
            document.getElementById('unit-list').innerHTML = Object.keys(units).map(key => `
                <a href="/study?unit=${key}" class="unit-card">
                    <h3>${units[key].title}</h3>
                    <p style="font-size: 13px; color: #64748b;">Bấm để làm bài tập.</p>
                </a>`).join('');

            const resDict = await fetch('/api/dictionary');
            globalDictionary = await resDict.json();
            
            const filter = document.getElementById('dict-filter');
            Object.keys(globalDictionary).forEach(key => {
                filter.innerHTML += `<option value="${key}">Unit ${key}</option>`;
            });

            renderDictionary();
        } catch (err) { console.error(err); }
    }

    function renderDictionary() {
        const filterValue = document.getElementById('dict-filter').value;
        const tbody = document.getElementById('vocab-body');
        let html = '';

        Object.keys(globalDictionary).sort((a,b) => a-b).forEach(unitKey => {
            if (filterValue === 'all' || filterValue === unitKey) {
                // Hàng tiêu đề Unit
                html += `<tr class="unit-group-header"><td colspan="2">UNIT ${unitKey}</td></tr>`;
                // Danh sách từ của Unit đó
                globalDictionary[unitKey].forEach(item => {
                    html += `<tr>
                        <td style="font-weight:600; width:40%; color:#4f46e5;">${item[0]}</td>
                        <td>${item[1]}</td>
                    </tr>`;
                });
            }
        });
        tbody.innerHTML = html;
    }
    initPage();
</script>
</body>
</html>
