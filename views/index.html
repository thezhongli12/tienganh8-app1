<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiếng Anh 8 - Menu Bài Học</title>
    <style>
        :root { --blue: #1a73e8; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 20px; text-align: center; }
        h1 { color: var(--blue); margin-bottom: 30px; text-transform: uppercase; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-width: 1100px; margin: 0 auto; }
        .card { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #eee; display: flex; flex-direction: column; justify-content: space-between; height: 180px; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
        .card.off { background: #fafafa; border: 1px dashed #ccc; opacity: 0.7; }
        h3 { margin: 0; color: #333; font-size: 1.4em; }
        p { color: #666; font-size: 0.95em; margin: 10px 0; }
        .btn { background: var(--blue); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; text-decoration: none; font-weight: bold; display: block; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>
    <h1>CHƯƠNG TRÌNH TIẾNG ANH 8</h1>
    <div id="unit-grid" class="grid"></div>

    <script>
        // Dữ liệu nhúng trực tiếp để sửa dứt điểm lỗi kết nối
        const unitData = {
            "unit1": "Leisure Activities", "unit2": "Life in the Countryside",
            "unit3": "Teenagers", "unit4": "Ethnic Groups of Vietnam",
            "unit5": "Our Customs and Traditions", "unit6": "Lifestyles",
            "unit7": "Environmental Protection", "unit8": "Shopping", "unit9": "Natural Disasters"
        };

        const grid = document.getElementById('unit-grid');
        // Luôn hiển thị đúng 12 Unit, từ 10-12 sẽ tự động báo Đang soạn
        for (let i = 1; i <= 12; i++) {
            const title = unitData[`unit${i}`];
            const card = document.createElement('div');
            card.className = title ? 'card' : 'card off';
            
            if (title) {
                card.innerHTML = `<div><h3>Unit ${i}</h3><p>${title}</p></div><a href="/study?u=${i}" class="btn">VÀO HỌC</a>`;
            } else {
                card.innerHTML = `<div><h3>Unit ${i}</h3><p><i>Đang soạn nội dung...</i></p></div><button class="btn" disabled>ĐANG CẬP NHẬT</button>`;
            }
            grid.appendChild(card);
        }
    </script>
</body>
</html>
