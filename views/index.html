<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học Tiếng Anh 8 - Trang Chủ</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #f0f2f5; color: #333; }
        nav { background: #1a73e8; color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 24px; font-weight: bold; text-decoration: none; color: white; }
        .nav-links a { color: white; text-decoration: none; margin-left: 15px; font-weight: 500; transition: 0.3s; }
        .nav-links a:hover { opacity: 0.8; }
        
        .hero { text-align: center; padding: 80px 20px; background: white; border-bottom: 1px solid #ddd; }
        .hero h1 { color: #1a73e8; font-size: 42px; margin-bottom: 10px; }
        .btn-study { background: #34a853; color: white; padding: 15px 40px; border-radius: 30px; text-decoration: none; font-size: 20px; display: inline-block; margin-top: 20px; box-shadow: 0 4px 15px rgba(52, 168, 83, 0.3); transition: 0.3s; border: none; cursor: pointer; }
        .btn-study:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(52, 168, 83, 0.4); }

        /* Phần mới: Danh sách Unit xem trước */
        .content-section { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .unit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 30px; }
        .unit-item { background: white; padding: 20px; border-radius: 12px; text-align: center; border: 1px solid #eee; transition: 0.3s; }
        .unit-item h3 { margin: 0; font-size: 16px; color: #555; }
        .logged-in .unit-item:hover { border-color: #1a73e8; background: #e8f0fe; cursor: pointer; }
        
        .badge-admin { background: #fbbc05; color: #000; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; vertical-align: middle; }
    </style>
</head>
<body>

<nav>
    <a href="/" class="logo">ENGLISH 8</a>
    <div class="nav-links" id="auth-zone">
        <a href="/login">Đăng nhập</a>
        <a href="/register">Đăng ký</a>
    </div>
</nav>

<div class="hero">
    <h1>Chinh Phục Tiếng Anh Lớp 8</h1>
    <p>Hệ thống bài tập trắc nghiệm đầy đủ 12 Unit theo chương trình mới.</p>
    <div id="action-zone">
        <a href="/login" class="btn-study">Đăng nhập để bắt đầu</a>
    </div>
</div>

<div class="content-section">
    <h2 style="text-align: center; color: #5f6368;">Lộ trình học tập (12 Units)</h2>
    <div class="unit-grid" id="unit-preview">
        </div>
</div>

<script>
    // Hàm tạo danh sách Unit xem trước
    function renderUnitPreview() {
        const grid = document.getElementById('unit-preview');
        for (let i = 1; i <= 12; i++) {
            grid.innerHTML += `
                <div class="unit-item" onclick="handleUnitClick(${i})">
                    <h3>Unit ${i}</h3>
                    <p style="font-size: 12px; color: #888;">Nội dung SGK mới</p>
                </div>
            `;
        }
    }

    function handleUnitClick(id) {
        // Nếu click vào unit mà chưa log in thì nhắc nhở
        window.location.href = "/study";
    }

    async function checkUserStatus() {
        try {
            const res = await fetch('/api/user-status');
            const data = await res.json();
            
            const authZone = document.getElementById('auth-zone');
            const actionZone = document.getElementById('action-zone');
            const body = document.body;

            if (data.loggedIn) {
                body.classList.add('logged-in'); // Cho phép hover vào các Unit
                
                // 1. Cập nhật thanh Menu
                let adminLabel = data.role === 'admin' ? '<span class="badge-admin">ADMIN</span> ' : '';
                let adminLink = data.role === 'admin' ? '<a href="/admin-dashboard" style="color:#fbbc05; font-weight:bold;">★ QUẢN LÝ</a>' : '';
                
                authZone.innerHTML = `
                    <span style="margin-right:10px">${adminLabel}Chào, <b>${data.username}</b></span>
                    ${adminLink}
                    <a href="/logout" style="background:rgba(255,255,255,0.2); padding:5px 12px; border-radius:8px">Thoát</a>
                `;

                // 2. Cập nhật nút bấm chính
                actionZone.innerHTML = `<a href="/study" class="btn-study">VÀO HỌC NGAY</a>`;
            }
        } catch (e) {
            console.log("Kết nối Server thất bại");
        }
    }

    // Khởi chạy các tính năng
    renderUnitPreview();
    checkUserStatus();
</script>

</body>
</html>
