<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Admin - Quản lý Người dùng</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; }
        header { background: #1c1e21; color: white; padding: 15px 5%; display: flex; justify-content: space-between; }
        .container { padding: 30px 5%; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #007bff; color: white; }
        tr:hover { background: #f1f1f1; }
        .pw-code { background: #eee; padding: 3px 6px; border-radius: 4px; font-family: monospace; }
    </style>
</head>
<body>
    <header>
        <h2>Hệ thống Quản trị</h2>
        <a href="/logout" style="color: #ff4757; text-decoration: none; font-weight: bold;">Đăng xuất</a>
    </header>
    <div class="container">
        <h1>Danh sách thành viên đăng ký</h1>
        <table>
            <thead>
                <tr>
                    <th>Ngày đăng ký</th>
                    <th>Tên tài khoản</th>
                    <th>Mật khẩu</th>
                </tr>
            </thead>
            <tbody>
                <% usersList.forEach(u => { %>
                <tr>
                    <td><%= new Date(u.createdAt).toLocaleString('vi-VN') %></td>
                    <td><strong><%= u.username %></strong></td>
                    <td><span class="pw-code"><%= u.password %></span></td>
                </tr>
                <% }) %>
            </tbody>
        </table>
    </div>
</body>
</html>
