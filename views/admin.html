<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - English 8</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f1f5f9; margin: 0; display: flex; }
        .sidebar { width: 250px; background: #1e293b; color: white; height: 100vh; padding: 20px; position: fixed; }
        .main { margin-left: 270px; padding: 30px; flex: 1; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: #3b82f6; color: white; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
        .pass-text { color: #e11d48; font-family: monospace; font-weight: bold; background: #fff1f2; padding: 2px 6px; border-radius: 4px; }
        .time-text { color: #64748b; font-size: 12px; }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>ADMIN PANEL</h2>
    <p>Chào sếp! (Pass: 080212)</p>
    <hr>
    <a href="/" style="color:white; text-decoration:none;">🏠 Về Trang Chủ</a><br><br>
    <a href="/logout" style="color:#fb7185; text-decoration:none;">🚪 Đăng xuất</a>
</div>

<div class="main">
    <div class="card">
        <h1>Danh sách học sinh</h1>
        <p>Tổng số thành viên: <span id="total-count" style="font-weight:bold;">0</span></p>
        
        <table>
            <thead>
                <tr>
                    <th>Ngày đăng ký</th>
                    <th>Tên tài khoản</th>
                    <th>Mật khẩu</th>
                    <th>Vai trò</th>
                </tr>
            </thead>
            <tbody id="user-list">
                <tr><td colspan="4" style="text-align:center;">Đang tải dữ liệu...</td></tr>
            </tbody>
        </table>
    </div>
</div>



<script>
    async function loadData() {
        try {
            const res = await fetch('/api/admin/users');
            const data = await res.json();

            if (data.success) {
                document.getElementById('total-count').innerText = data.users.length;
                const tbody = document.getElementById('user-list');
                tbody.innerHTML = data.users.map(u => {
                    const time = u.createdAt ? new Date(u.createdAt).toLocaleString('vi-VN') : 'Trước đó';
                    return `
                        <tr>
                            <td class="time-text">${time}</td>
                            <td><b>${u.username}</b></td>
                            <td><span class="pass-text">${u.password}</span></td>
                            <td>${u.role === 'admin' ? '⭐ Admin' : 'Học sinh'}</td>
                        </tr>
                    `;
                }).join('');
            } else {
                alert("Lỗi: " + data.message);
                window.location.href = "/";
            }
        } catch (err) { console.error("Lỗi fetch:", err); }
    }
    loadData();
</script>

</body>
</html>
